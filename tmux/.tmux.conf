################################################################################
# tmux configuration file
################################################################################

# full color, so agent TUIs render correctly
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# pass modified keys through (e.g. shift+enter in agent prompts)
set -s extended-keys on
set -as terminal-features ",*:extkeys"

# let escape sequences (agent notifications, hyperlinks) reach the terminal
set -g allow-passthrough on
set -g focus-events on

# increase history size
set -g history-limit 50000

# start window numbering at 1
set -g base-index 1

# start pane numbering at 1
set -g pane-base-index 1

# use vim-like shortcuts in copy mode
setw -g mode-keys vi

# address vim mode switching delay
set -s escape-time 0

# change the prefix
unbind C-b
set -g prefix C-a

# fix getting to beginning of line
bind a send-prefix

# more sensible pane split keys
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# new windows start in the current directory
bind c new-window -c '#{pane_current_path}'

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# source the config file
bind r source-file ~/.tmux.conf \; display "Sourced config file!"

# messages are displayed for 3 seconds
set -g display-time 3000

# refresh status messages more often
set -g status-interval 5

# set title string
set-option -g set-titles on
set-option -g set-titles-string '#H: session-#S window-#I pane-#P'

# set status string
set -g status-left "(#S) [#I.#P] "
set -g status-left-length 16
set -g status-right " %m/%d/%Y %l:%M %p  (#h) "

# flag windows that ring the bell (agents do this when they need input)
# rather than every window with output, which is constant with agents running
setw -g monitor-activity off
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off
set-window-option -g window-status-bell-style bg=red,fg=white

# highlight active window
set-window-option -g window-status-current-style bg=cyan

# turn off window renaming
set-option -g allow-rename off

# plugin for better copying to clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# plugin for saving / restoring tmux state
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# initialize tmux plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
